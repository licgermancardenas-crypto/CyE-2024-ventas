<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C&E · Dashboard Facturación 2024</title>
<style>
:root{--bg:#0D0D0D;--bg2:#141414;--bg3:#1A1A1A;--green:#00923F;--green2:#00C853;--text:#F0F0F0;--text2:#A0A0A0;--border:#1E1E1E;--border2:#2A2A2A}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
/* TOP NAV */
.topnav{background:var(--bg2);border-bottom:0.5px solid var(--border2);display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;flex-shrink:0}
.logo-wrap{display:flex;align-items:center;gap:12px}
.logo{background:var(--green);color:#fff;font-size:13px;font-weight:700;padding:5px 11px;border-radius:6px;letter-spacing:.5px}
.brand{font-size:14px;font-weight:500;color:var(--text)}
.brand-sub{font-size:11px;color:var(--text2);margin-left:8px}
.nav-tabs{display:flex;gap:2px;align-items:center}
.tab{font-size:11px;padding:6px 14px;border-radius:6px;cursor:pointer;color:var(--text2);border:0.5px solid transparent;transition:all .15s;white-space:nowrap;text-decoration:none;display:flex;align-items:center;gap:6px}
.tab:hover{background:var(--bg3);color:var(--text)}
.tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.tab-num{font-size:9px;opacity:.7}
.nav-right{display:flex;align-items:center;gap:10px}
.date-badge{font-size:10px;color:var(--text2);padding:4px 10px;border-radius:99px;background:var(--bg3);border:0.5px solid var(--border2)}
/* IFRAME */
.frame-wrap{flex:1;position:relative;overflow:hidden}
iframe{width:100%;height:100%;border:none;background:var(--bg)}
/* LOADING */
.loading{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10;transition:opacity .3s}
.loading.hidden{opacity:0;pointer-events:none}
.spinner{width:36px;height:36px;border:2px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
.loading-text{font-size:12px;color:var(--text2)}
@keyframes spin{to{transform:rotate(360deg)}}
/* STATUS BAR */
.statusbar{background:var(--bg2);border-top:0.5px solid var(--border2);padding:4px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.status-left{display:flex;align-items:center;gap:16px}
.status-item{font-size:10px;color:var(--text2);display:flex;align-items:center;gap:5px}
.dot-green{width:6px;height:6px;border-radius:50%;background:var(--green2);box-shadow:0 0 6px var(--green2)}
.dot-gray{width:6px;height:6px;border-radius:50%;background:var(--text2)}
</style>
</head>
<body>

<div class="topnav">
  <div class="logo-wrap">
    <div class="logo">C&amp;E</div>
    <span class="brand">Dashboard de Facturación</span>
    <span class="brand-sub">2024</span>
  </div>

  <nav class="nav-tabs">
    <a class="tab active" onclick="showPage(0,this)" href="#">
      <span class="tab-num">01</span> Resumen Ejecutivo
    </a>
    <a class="tab" onclick="showPage(1,this)" href="#">
      <span class="tab-num">02</span> Productos
    </a>
    <a class="tab" onclick="showPage(2,this)" href="#">
      <span class="tab-num">03</span> Vendedores
    </a>
    <a class="tab" onclick="showPage(3,this)" href="#">
      <span class="tab-num">04</span> Geográfico
    </a>
    <a class="tab" onclick="showPage(4,this)" href="#">
      <span class="tab-num">05</span> Mapa
    </a>
  </nav>

  <div class="nav-right">
    <div class="date-badge">Datos al 31/12/2024</div>
  </div>
</div>

<div class="frame-wrap">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Cargando dashboard...</div>
  </div>
  <iframe id="frame" src="P1_Resumen_Ejecutivo.html" onload="hideLoading()"></iframe>
</div>

<div class="statusbar">
  <div class="status-left">
    <div class="status-item"><div class="dot-green"></div> Modelo activo</div>
    <div class="status-item"><div class="dot-green"></div> 144.021 transacciones</div>
    <div class="status-item"><div class="dot-gray"></div> <span id="page-label">Resumen Ejecutivo</span></div>
  </div>
  <div class="status-item">ATLAS Analytics · C&amp;E · 2024</div>
</div>

<script>
const PAGES = [
  {file:'P1_Resumen_Ejecutivo.html', label:'Resumen Ejecutivo'},
  {file:'P2_Productos.html',         label:'Análisis de Productos'},
  {file:'P3_Vendedores.html',        label:'Performance por Vendedor'},
  {file:'P4_Geografico.html',        label:'Análisis Geográfico'},
  {file:'P5_Mapa.html',label:'Mapa Interactivo GBA + CABA'},
];

function showPage(idx, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('frame').src = PAGES[idx].file;
  document.getElementById('page-label').textContent = PAGES[idx].label;
  return false;
}

function hideLoading() {
  document.getElementById('loading').classList.add('hidden');
}

// Keyboard navigation
document.addEventListener('keydown', e => {
  const tabs = document.querySelectorAll('.tab');
  const active = Array.from(tabs).findIndex(t => t.classList.contains('active'));
  if (e.key === 'ArrowRight' && active < tabs.length-1) tabs[active+1].click();
  if (e.key === 'ArrowLeft'  && active > 0)             tabs[active-1].click();
});
</script>
</body>
</html>
